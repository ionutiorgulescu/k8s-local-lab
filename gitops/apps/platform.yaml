# Plain manifests the app relies on: the shop namespace (with Pod Security labels) and
# the cluster-wide GatewayClass + EnvoyProxy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Wave 1: the GatewayClass needs the EnvoyProxy CRD from envoy-gateway (wave 0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/ionutiorgulescu/k8s-local-lab.git
    targetRevision: main
    path: gitops/platform
  destination:
    server: https://kubernetes.default.svc
    # Required by the platform project, which only allows listed namespaces (an empty
    # namespace matches none: InvalidSpecError). The only namespaced object here, the
    # EnvoyProxy, lives in envoy-gateway-system; cluster-scoped objects (the Namespace,
    # the GatewayClass) ignore this field.
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
