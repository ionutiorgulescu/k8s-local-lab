# Envoy Gateway: the Gateway API controller. Also installs the Gateway API CRDs and its
# own (EnvoyProxy, ...), which the platform app needs, hence wave 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    # OCI registry; registered in gitops/argocd/values.yaml (configs.repositories).
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.10.0         # Envoy 1.40, Gateway API v1.6.1, Kubernetes 1.34-1.37
    helm:
      releaseName: eg               # same as the Phase 2 Helm release, so objects are adopted
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Gateway API CRDs are too large for client-side apply, which stores a full copy
      # of each object in the last-applied-configuration annotation (limit: 256 KiB).
      # Server-side apply doesn't need that annotation.
      - ServerSideApply=true
