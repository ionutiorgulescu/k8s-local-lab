# Argo CD Application for the shop app.
#
# An Application says: render THIS source (a path in a Git repo) and keep it applied
# to THAT destination (a cluster and namespace). Application objects live in the argocd
# namespace, wherever their workloads go.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
  annotations:
    # Wave 2: needs the namespace and the GatewayClass from platform (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  # The shop project (projects.yaml): only this repo, only the shop namespace, no
  # cluster-scoped objects.
  project: shop

  # Two sources from the same repository (Argo CD "multiple sources"):
  #   1. the chart, charts/shop: a reusable package with only default values
  #   2. "values": not rendered itself, just a place to read files from. The environment's
  #      settings live in gitops/envs/local/shop.yaml, separate from the chart, so adding an
  #      environment is a new file, and CI's image-tag commits don't touch the chart.
  # Argo CD reads GitHub, not your laptop: changes count only once pushed.
  sources:
    - repoURL: https://github.com/ionutiorgulescu/k8s-local-lab.git
      # Follow the tip of main. (Pinning a tag or commit SHA is the stricter alternative.)
      targetRevision: main
      path: charts/shop
      helm:
        # Must stay "shop": the chart puts the release name into the selector labels
        # (app.kubernetes.io/instance), and selectors can't change on existing objects.
        releaseName: shop
        # $values = the root of the source with ref "values" below.
        valueFiles:
          - $values/gitops/envs/local/shop.yaml
    - repoURL: https://github.com/ionutiorgulescu/k8s-local-lab.git
      targetRevision: main
      ref: values

  destination:
    # The cluster Argo CD itself runs in.
    server: https://kubernetes.default.svc
    namespace: shop

  syncPolicy:
    automated:
      # Delete objects from the cluster when they disappear from Git. Without this,
      # removed objects are only reported (as "requires pruning") and left running.
      prune: true
      # Undo changes made directly in the cluster (kubectl edit/delete/patch), not only
      # apply new Git commits. Git is the only way to change what runs.
      selfHeal: true
