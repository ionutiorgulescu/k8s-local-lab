# Helm values for Argo CD on the kind lab.
# Chart: argo-cd 10.19.0 (Argo CD v3.6.2) from https://argoproj.github.io/argo-helm
#
# Kept small for a laptop: one replica of everything, and the optional components
# this lab doesn't use yet are turned off.

# Dex is Argo CD's built-in SSO bridge (GitHub, OIDC...). No SSO yet: log in with the
# local admin account.
dex:
  enabled: false

# Sends Slack/email/webhook messages on sync events. Not needed for the lab.
notifications:
  enabled: false

configs:
  # Chart repositories Argo CD must be told about. Envoy Gateway's chart is stored in an
  # OCI registry (like a container image), and Argo CD only uses OCI for Helm when the
  # repository is registered with enableOCI. Public, so no credentials.
  repositories:
    envoyproxy-oci:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: "true"

  cm:
    # A second local account, "dev", that can log in to the UI and CLI (no API tokens).
    # Its password is set by an admin: argocd account update-password --account dev
    accounts.dev: login

    # Report a child Application's health to its parent. Argo CD stopped doing this by
    # default (v1.8), which makes sync waves between Applications pointless: the root app
    # wouldn't wait for wave 0 (e.g. Envoy Gateway) to be Healthy before starting wave 1.
    # Snippet from the Argo CD docs.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  # Argo CD's own RBAC (separate from Kubernetes RBAC: it controls what people may do
  # through Argo CD). Format: p, <subject>, <resource>, <action>, <project>/<object>, allow|deny
  rbac:
    # Accounts get nothing unless a policy grants it. (admin keeps the built-in role:admin.)
    policy.default: ""
    policy.csv: |
      # Read-only access to the shop project, mirroring the Phase 2 Kubernetes "developer"
      # Role: see apps, their resources and pod logs; no sync, no rollback, no exec, no edits.
      p, role:shop-readonly, applications, get, shop/*, allow
      p, role:shop-readonly, logs, get, shop/*, allow
      p, role:shop-readonly, projects, get, shop, allow
      g, dev, role:shop-readonly

  params:
    # Serve the UI and API over plain HTTP inside the cluster. You reach it through
    # kubectl port-forward (an encrypted tunnel to the pod), so TLS here would only add
    # self-signed certificate warnings. With a real ingress you'd terminate TLS there.
    server.insecure: true
