# Cluster-wide gateway setup for the kind lab. Deployed by the platform Application
# (sync wave 1), after envoy-gateway (wave 0) has installed the EnvoyProxy kind. Not part
# of the app chart: one GatewayClass serves every app's Gateways.

# EnvoyProxy: how Envoy Gateway deploys the Envoy proxy for Gateways of this class.
# Here: expose it with a NodePort Service on a fixed port, 30080, instead of the default
# LoadBalancer.
#
# Why not LoadBalancer: kind has no cloud load balancer, so the Service never gets an
# external address, the Gateway never becomes "Programmed", and Argo CD reports it as
# Progressing forever.
# Why NodePort: it opens port 30080 on every node, and cluster/kind.yaml publishes that
# port on the Mac (127.0.0.1:8088). So http://shop.localhost:8088 reaches Envoy without
# kubectl port-forward (*.localhost always means this machine; Safari needs an /etc/hosts
# line for it).
# On EKS this would be LoadBalancer (provisioned by the AWS Load Balancer Controller).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        # Envoy Gateway defaults to Local: external traffic may only use an Envoy pod on the
        # node it arrived at (keeps the client's IP). The kind port mapping always lands on
        # the control-plane, which never runs Envoy, so with Local every request from the Mac
        # was dropped. Cluster: any node forwards to Envoy wherever it runs; Envoy then sees
        # the node's address instead of the client's (fine for this lab).
        externalTrafficPolicy: Cluster
        # There's no dedicated field for the node port number, so patch the generated
        # Service (a strategic merge: the entry for port 80 gets nodePort 30080).
        # A fixed number, because the kind port mapping must know it in advance.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
# Links the GatewayClass name "eg" to the Envoy Gateway controller, with the
# EnvoyProxy settings above.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind
    namespace: envoy-gateway-system
