# kind cluster: images from GHCR (tags written by CI), in-cluster Postgres, reached through
# Envoy Gateway as http://shop.localhost:8088.
#
# Deployed by Argo CD (gitops/apps/shop.yaml): change this file, commit and push.

api:
  image:
    # repository and tag are written by CI (.github/workflows/shop-api.yml) on every push
    # that changes app/: the image built from that commit, published to GHCR.
    repository: ghcr.io/ionutiorgulescu/shop-api
    # Tags are never reused (one per commit), so a cached copy is always the right one.
    pullPolicy: IfNotPresent
    tag: sha-2900286
gateway:
  hostname: shop.localhost
rbac:
  developer:
    createServiceAccount: true
    subjects:
      - kind: ServiceAccount
        name: dev
frontend:
  # Switched on once CI had published a first image (sha-47432b0). repository and tag are
  # written by CI (.github/workflows/shop-frontend.yml) on every push that changes frontend/.
  enabled: true
  image:
    repository: ghcr.io/ionutiorgulescu/shop-frontend
    tag: sha-47432b0
