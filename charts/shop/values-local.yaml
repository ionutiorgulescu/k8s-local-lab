# kind cluster: image loaded with `kind load docker-image`, in-cluster Postgres,
# reached through Envoy Gateway as shop.local.
#
# Deployed by Argo CD (gitops/apps/shop.yaml): change this file, commit and push.

api:
  image:
    repository: ghcr.io/ionutiorgulescu/shop-api
    pullPolicy: IfNotPresent # the image exists only inside the kind nodes
    tag: sha-2900286
gateway:
  hostname: shop.local
rbac:
  developer:
    createServiceAccount: true
    subjects:
      - kind: ServiceAccount
        name: dev
