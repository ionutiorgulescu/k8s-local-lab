# NetworkPolicies for the shop namespace: deny all incoming traffic, then allow only the
# two paths the app needs:
#
#   Envoy (envoy-gateway-system) --8080--> api pods --5432--> postgres pod
#
# How NetworkPolicies combine:
#   - A pod with NO policy selecting it accepts traffic from anywhere (the default).
#   - Once ANY policy with policyTypes [Ingress] selects a pod, only traffic that some
#     policy explicitly allows can reach it. Everything else is dropped.
#   - Policies only ever ADD allowed traffic; there are no "deny" rules. So: one
#     deny-all policy, plus one small allow policy per path.
#
# Enforced by Cilium (the CNI). kind's default CNI would accept these objects but
# silently ignore them.
#
# Not affected: kubelet health probes (traffic from the pod's own node is always allowed),
# `kubectl port-forward` and `kubectl exec` (they run inside the pod, not over the network).

# 1. Default deny: selects every pod in the namespace (empty podSelector) and allows
#    nothing, so all incoming traffic is dropped unless another policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: shop
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. Envoy -> API. Allows the Envoy proxy pods to reach the API on 8080, the CONTAINER
#    port (Envoy sends traffic straight to pod IPs, not through the Service's port 80).
#    kubernetes.io/metadata.name is a label Kubernetes puts on every namespace
#    automatically, so it can't be faked by adding a label to some other namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-gateway
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 8080
---
# 3. API -> Postgres. A podSelector with no namespaceSelector means "pods with this label
#    in the SAME namespace (shop)". Nothing else, inside or outside shop, can reach 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-api
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432
