# RBAC: a read-only "developer" role in the shop namespace.
#
# RBAC has three parts:
#   Role         - WHAT is allowed: verbs (get, list, ...) on resources, in ONE namespace.
#                  (A ClusterRole is the same, but cluster-wide or reusable across namespaces.)
#   Subject      - WHO: a User, a Group, or a ServiceAccount.
#   RoleBinding  - connects a Role to subjects, in one namespace.
#
# RBAC only grants; there are no deny rules. Anything not listed is forbidden.
#
# Here the subject is a ServiceAccount so you can test it locally. On EKS, humans
# authenticate through AWS IAM and you'd bind the Role to a Group instead (mapped from an
# IAM role via EKS access entries), never hand out ServiceAccount tokens to people.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: shop
rules:
  # Read workloads and their status. Deliberately NOT included:
  #   secrets      - "list" and "watch" return the full objects, values included, so
  #                  read access to secrets can never be "metadata only".
  #   pods/exec    - a shell in a container can read its env vars (DB_PASSWORD) and files.
  #   pods/portforward, and any create/update/delete verb.
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps, events,
                persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-dev
  namespace: shop
roleRef:                       # can't be changed after creation; delete and recreate instead
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer
subjects:
  - kind: ServiceAccount
    name: dev
    namespace: shop
