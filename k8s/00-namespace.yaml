# The "shop" namespace, with Pod Security Admission (PSA) set to the "restricted" level.
#
# PSA is built into the API server. When a pod is created in this namespace, it checks the
# pod's security settings against one of three standard levels:
#   privileged  - no checks
#   baseline    - blocks known privilege escalations (hostNetwork, privileged containers...)
#   restricted  - baseline plus hardening: must run as non-root, drop ALL capabilities,
#                 disallow privilege escalation, and set a seccomp profile
#
# Three modes, each set with its own label:
#   enforce - pods that violate the level are REJECTED
#   warn    - kubectl prints a warning, but the pod is allowed
#   audit   - the violation is recorded in the API server's audit log
#
# The *-version labels pin which version of the rules applies. Without them, PSA uses
# "latest", so a cluster upgrade could add new checks and suddenly reject your pods.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
