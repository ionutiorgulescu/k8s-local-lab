# Replaces the image's /etc/nginx/conf.d/default.conf. The nginx-unprivileged image already
# keeps its pid file and temp files in /tmp (writable via an emptyDir in Kubernetes), so the
# rest of the filesystem can be read-only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Don't advertise the nginx version (same idea as X-Powered-By on the API).
    server_tokens off;

    # For the kubelet's probes. Not a real page.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in every asset name (index-3f9a2c.js), so a new build gets
    # new file names: browsers can cache these forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Everything else is the single-page app. index.html must never be cached, or browsers
    # would keep pointing at the previous build's assets after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ /index.html;
    }
}
