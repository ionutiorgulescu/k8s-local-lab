# kind cluster for the lab (Phases 2 and 3).
#
# Node image: Kubernetes 1.36.4, built for kind v0.33.0 (see the kind release notes).
#   - 1.36 is in EKS standard support until 2027-08-02.
#   - It matches kubectl v1.36 exactly, so there is no version skew.
#   - The @sha256 digest is required: kind images are built for a specific kind release,
#     and the digest guarantees you get that build, not whatever the tag points to later.
#
# CNI: disabled here; Cilium v1.20.5 is installed afterwards (see cluster/README.md),
# because kind's default CNI (kindnet) does not enforce NetworkPolicies.
#
# kube-proxy: not installed. Cilium handles Services and NodePorts itself with eBPF
# ("kube-proxy replacement"). With kube-proxy, NodePort traffic that had to be forwarded to
# a pod on another node was lost in the hand-off from kube-proxy to Cilium's VXLAN tunnel.
# See docs/decisions/0001-cilium-kube-proxy-replacement.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
networking:
  disableDefaultCNI: true
  kubeProxyMode: "none"
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    # Publish the Envoy NodePort (30080, set in gitops/platform/gatewayclass.yaml) on the
    # Mac, like `docker run -p 127.0.0.1:8088:30080`: http://shop.local:8088 then reaches
    # Envoy without kubectl port-forward. Any node works, since a NodePort is open on every
    # node. Only read when the cluster is created.
    #   listenAddress 127.0.0.1: reachable from this Mac only, not from the network.
    #   hostPort 8088: macOS doesn't let normal programs bind ports below 1024 on a
    #   specific address, and 8080/8888 are used by the Argo CD and Envoy port-forwards.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
