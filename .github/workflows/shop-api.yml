# When to build and deploy the API. The steps live in build-and-deploy.yml.
name: shop-api

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      # Documentation changes don't need a new image.
      - "!services/api/**/*.md"
      - ".github/workflows/shop-api.yml"
      - ".github/workflows/build-and-deploy.yml"
  # Allows a manual run from the Actions tab.
  workflow_dispatch: {}

# Nothing by default; the job below grants only what the build needs.
permissions: {}

# One deploy of this service at a time; a newer push waits instead of racing the previous one.
concurrency:
  group: deploy-shop-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    permissions:
      contents: write
      packages: write
    with:
      service: api
