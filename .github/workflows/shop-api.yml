# CI for shop-api: build the image, publish it to GHCR, and deploy it through Git.
#
#   push to main touching app/  ->  build linux/amd64 + linux/arm64
#                               ->  push ghcr.io/<owner>/shop-api:sha-<commit>
#                               ->  commit the new image into charts/shop/values-local.yaml
#                               ->  Argo CD syncs that commit (rolling update)
#
# Actions are pinned by commit SHA (a tag like v4 can be moved to other code).
name: shop-api

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/shop-api.yml"
  # Allows a manual run from the Actions tab.
  workflow_dispatch: {}

# The workflow's built-in token gets only what it needs.
permissions:
  contents: write   # commit the new image tag
  packages: write   # push to GHCR

# One deploy at a time; a newer push waits instead of racing the previous one.
concurrency:
  group: shop-api-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shop-api
  VALUES_FILE: charts/shop/values-local.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, so the deploy commit can rebase cleanly

      - name: Compute the image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The kind nodes on an Apple Silicon Mac are arm64, GitHub's runners amd64 (and EKS
      # nodes may be either). QEMU emulates arm64 so one build produces both.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Standard OCI labels; org.opencontainers.image.source links the package to this repo.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.vars.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_REVISION=${{ github.sha }}
          # Reuse layers between runs (npm ci only reruns when the lockfile changes).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy = a Git commit. Argo CD picks it up like any other change. Commits made with
      # the built-in token don't trigger workflows, and this one only touches charts/, so
      # there's no loop.
      - name: Commit the new image to Git
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          yq -i '.api.image.repository = strenv(IMAGE) | .api.image.tag = strenv(TAG)' "$VALUES_FILE"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "Deploy shop-api ${TAG}" \
            -m "Built from ${GITHUB_SHA} by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
