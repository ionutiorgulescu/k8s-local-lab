# When to build and deploy the frontend. The steps live in build-and-deploy.yml.
name: shop-frontend

on:
  push:
    branches: [main]
    paths:
      - "services/frontend/**"
      # Documentation changes don't need a new image.
      - "!services/frontend/**/*.md"
      - ".github/workflows/shop-frontend.yml"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: deploy-shop-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    permissions:
      contents: write
      packages: write
    with:
      service: frontend
