# CI for the shop frontend: same pattern as shop-api.yml.
#
#   push to main touching frontend/  ->  build linux/amd64 + linux/arm64
#                                    ->  push ghcr.io/<owner>/shop-frontend:sha-<commit>
#                                    ->  commit the new image into charts/shop/values-local.yaml
#                                    ->  Argo CD syncs that commit (once frontend.enabled is true)
#
# The Dockerfile builds the static files once, on the runner's own platform
# (FROM --platform=$BUILDPLATFORM); only the nginx stage is per-platform.
# Actions are pinned by commit SHA (a tag like v4 can be moved to other code).
name: shop-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/shop-frontend.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the new image tag
  packages: write   # push to GHCR

concurrency:
  group: shop-frontend-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shop-frontend
  VALUES_FILE: charts/shop/values-local.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute the image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.vars.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_REVISION=${{ github.sha }}
          # Separate cache scope from shop-api, so the two workflows don't evict each other.
          cache-from: type=gha,scope=shop-frontend
          cache-to: type=gha,scope=shop-frontend,mode=max

      # Only the frontend's keys are touched, so this can't conflict with shop-api's deploy
      # commits to the same file. Commits made with the built-in token don't trigger
      # workflows, and this one only touches charts/, so there's no loop.
      - name: Commit the new image to Git
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          yq -i '.frontend.image.repository = strenv(IMAGE) | .frontend.image.tag = strenv(TAG)' "$VALUES_FILE"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "Deploy shop-frontend ${TAG}" \
            -m "Built from ${GITHUB_SHA} by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
